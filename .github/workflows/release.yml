name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:vscode
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" apps/vscode/dist/*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" apps/vscode/dist/*.vsix --generate-notes
          fi
      - name: Dispatch Marketplace publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run marketplace.yml \
            --ref "$GITHUB_REF_NAME" \
            --field tag="$GITHUB_REF_NAME" \
            --field prerelease=false
